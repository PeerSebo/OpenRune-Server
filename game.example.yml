name: "OpenRune"
game-port: 43594
revision: 241
environment: "LIVE"
world: 255

gameplay:
  drop-rates:
    # Applies to drops explicitly marked as boosted. 2.0 doubles their chance.
    multiplier: 1.0
# Server-wide XP multiplier, applied to existing characters on login. Keep this key for install defaults.
  xp-rate: 10.0

  quest-requirements:
# Optional bypasses access requirements while preserving real quest objectives and rewards.
# Respect-progress enforces quest gates; virtual-completions supports league profiles.
    mode: "optional"
    virtual-completions: []
    virtual-lines: []

central:
  same-instance: true
  host: "127.0.0.1"
  link-port: 9091
  postgres:
    pool-size: 10


